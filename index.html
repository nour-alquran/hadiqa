<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>حديقة الحافظ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&family=Amiri+Quran&display=swap">
<style>
/* Layout: one-column app, sticky top bar + bottom tab bar; garden of 37 plots is the home. Single bright "daytime garden" world. */
:root{
  --bg:#FFF7EA; --bg2:#FFEFD6; --card:#FFFFFF; --ink:#22304A; --muted:#6B7590;
  --mint:#17B897; --mint-d:#0E8F75; --sun:#FFC23D; --sun-d:#E59E00; --coral:#FF6B5E; --coral-d:#D94A3F;
  --grape:#7A5CFA; --grape-d:#5A3ED6; --sky:#4FB3FF; --sky-d:#2A8FDB; --soil:#B9824F; --leaf:#4CAF50; --line:#F0E2C8;
  --ui:"Alexandria",system-ui,"Segoe UI",Tahoma,sans-serif; --quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;direction:rtl;
  background-image:radial-gradient(circle at 15% 10%,#FFE6B3 0 120px,transparent 121px),radial-gradient(circle at 90% 30%,#E3F6EE 0 160px,transparent 161px);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:var(--ui);cursor:pointer;color:inherit}
button:focus-visible,select:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.top .in{max-width:980px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;margin-inline-end:auto;white-space:nowrap}
.brand svg{width:34px;height:34px}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.chip svg{width:20px;height:20px}
.chip.lvl{background:var(--grape);color:#fff;border-color:var(--grape-d)}
@media (max-width:520px){.brand span{display:none}.chip{padding:4px 9px;font-size:14px}}
/* bottom tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{border:0;background:none;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
.tab svg{width:28px;height:28px}
.tab[aria-current="true"]{background:#FFF1D2;color:var(--ink)}
/* generic */
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:24px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.btn{border:0;border-radius:18px;padding:13px 20px;font-weight:800;font-size:17px;color:#fff;background:var(--mint);box-shadow:0 5px 0 var(--mint-d);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--mint-d)}
.btn.sun{background:var(--sun);color:#3a2a00;box-shadow:0 5px 0 var(--sun-d)} .btn.sun:active{box-shadow:0 1px 0 var(--sun-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)} .btn.coral:active{box-shadow:0 1px 0 var(--coral-d)}
.btn.grape{background:var(--grape);box-shadow:0 5px 0 var(--grape-d)} .btn.grape:active{box-shadow:0 1px 0 var(--grape-d)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--sky-d)} .btn.sky:active{box-shadow:0 1px 0 var(--sky-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:18px;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* mascot */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;background:linear-gradient(135deg,#FFE9B8,#FFF7E6);border:2px solid #F6D99A;border-radius:28px}
.nour{width:120px;height:150px;flex:none}
.nour .body{transform-origin:60px 140px;animation:bob 2.6s ease-in-out infinite}
.nour .eyes{transform-origin:60px 78px;animation:blink 4.2s infinite}
.nour.happy .body{animation:jump .6s ease 2}
.nour.sad .body{animation:tilt 1s ease}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.05,.95)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 16px;font-weight:700;font-size:17px;line-height:1.6}
.bubble::after{content:"";position:absolute;right:-10px;top:24px;border:10px solid transparent;border-left-color:var(--card);border-right:0}
.bubble small{display:block;font-weight:500;color:var(--muted);font-size:14px;margin-top:2px}
@media (max-width:520px){.nour{width:90px;height:112px}.hero{padding:12px;gap:10px}.bubble{font-size:15px}}
/* level progress */
.lvlbar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.lvlbar .meter{flex:1;height:16px;background:#F3E8D2;border-radius:99px;overflow:hidden}
.lvlbar .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#7BE0B5);border-radius:99px;transition:width .6s}
.lvlbar b{font-size:15px;white-space:nowrap}
/* garden */
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.plot{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.plot:hover{transform:translateY(-3px)}
.plot svg{width:70px;height:70px}
.plot .nm{font-weight:700;font-size:15px}
.plot .st{font-size:11px;color:var(--muted)}
.plot.s3{background:#EFFBF3;border-color:#BFE8CC}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
/* section cards on home */
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.feat{grid-template-columns:1fr}}
.fcard{border:0;border-radius:24px;padding:18px;text-align:right;color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.fcard svg{width:46px;height:46px;flex:none}
.fcard b{display:block;font-size:20px} .fcard small{font-size:13px;opacity:.92}
/* surah picker */
.picker{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.pk{flex:none;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;font-weight:700;font-size:15px}
.pk[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* listen */
.player{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:18px;align-items:start}
@media (max-width:760px){.player{grid-template-columns:1fr}}
.vid{width:100%;max-width:100%;aspect-ratio:9/16;background:#161518;border-radius:24px;display:block;box-shadow:0 8px 0 rgba(0,0,0,.08)}
.vbox{max-width:340px;width:100%;margin-inline:auto}
.info{padding:18px;display:flex;flex-direction:column;gap:12px}
.info h3{font-size:30px;font-family:var(--quran);font-weight:400}
.ayahlist{font-family:var(--quran);font-size:24px;line-height:2.2;max-height:300px;overflow:auto;padding:4px 2px}
.num{font-family:var(--quran);color:var(--sun-d);font-size:.9em}
/* recite */
.mushaf{padding:22px 18px;font-family:var(--quran);font-size:30px;line-height:2.4;text-align:center;min-height:200px}
@media (max-width:520px){.mushaf{font-size:25px;padding:16px 10px}}
.w{display:inline-block;border-radius:10px;padding:0 3px;transition:color .25s,background .25s}
.w.hid{color:transparent;background:#F3E8D2;min-width:2.2em}
.w.ok{color:var(--ink);animation:pop .35s}
.w.cur{background:#FFE08A;color:transparent;box-shadow:0 0 0 3px var(--sun);animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,194,61,.35)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.ay{display:inline} .ay.done .num{color:var(--mint)}
.recbar{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--coral);box-shadow:0 7px 0 var(--coral-d);display:grid;place-items:center}
.mic svg{width:44px;height:44px}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 7px 0 var(--coral-d),0 0 0 0 rgba(255,107,94,.5)}100%{box-shadow:0 7px 0 var(--coral-d),0 0 0 26px rgba(255,107,94,0)}}
.status{font-weight:700;font-size:15px;color:var(--muted);text-align:center}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#F3E8D2;border-radius:18px;padding:4px;max-width:460px;width:100%;margin-inline:auto}
.seg button{border:0;background:none;border-radius:14px;padding:10px 6px;font-weight:800;font-size:15px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:560px}
.choices .opt{font-size:28px;padding:12px 6px}
.prog{height:8px;background:#F3E8D2;border-radius:0 0 20px 20px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#7BE0B5);transition:width .4s}
.btn.big{width:100%;padding:16px 20px;font-size:20px;border-radius:22px}
.btn.big svg{width:30px;height:30px}
.btn.ready{animation:ready 1.2s ease-in-out infinite}
@keyframes ready{50%{transform:scale(1.04)}}
.lst{align-items:center;text-align:center}
.vprog{height:10px;background:#F3E8D2;border-radius:99px;margin-top:10px;overflow:hidden}.vprog i{display:block;height:100%;width:0;background:var(--sky);border-radius:99px}
.vid{cursor:pointer}
.growbox{position:relative;width:150px;height:150px}
.growbox>div{position:absolute;inset:0;display:grid;place-items:center}
.g-old{animation:gout .6s .4s forwards}.g-new{animation:gin 1s .8s both}
@keyframes gout{to{opacity:0;transform:scale(.6)}}
@keyframes gin{from{opacity:0;transform:scale(.2) translateY(30px)}60%{opacity:1;transform:scale(1.12)}to{opacity:1;transform:scale(1)}}
.center{display:flex;flex-direction:column;align-items:center;gap:8px}
.bigplay{width:110px;height:110px;border-radius:50%;border:0;background:var(--sun);color:#3a2a00;box-shadow:0 7px 0 var(--sun-d);display:grid;place-items:center}
.bigplay svg{width:56px;height:56px}
.bigplay.playing,.acard.playing .aplay{animation:pulse2 1s infinite}
@keyframes pulse2{0%{box-shadow:0 7px 0 rgba(0,0,0,.15),0 0 0 0 rgba(255,194,61,.6)}100%{box-shadow:0 7px 0 rgba(0,0,0,.15),0 0 0 22px rgba(255,194,61,0)}}
.picopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.picopt{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:0 4px 0 var(--line)}
.picopt b{font-size:15px}
.scene{display:block;width:100%;aspect-ratio:240/213;border-radius:12px;background-repeat:no-repeat}
.picopt.right,.acard.right{border-color:var(--mint);background:#DDF6E8}.picopt.wrong,.acard.wrong{border-color:var(--coral);background:#FFE3DF;animation:shake .35s}
.aopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acard{border:3px solid var(--line);background:var(--card);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.acard.used{opacity:.35;pointer-events:none}
.aplay{width:100%;aspect-ratio:1;max-width:120px;border:0;border-radius:50%;background:var(--c);display:grid;place-items:center;position:relative;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.aplay>svg{width:55%;height:55%}
.aplay .wave{position:absolute;bottom:-4px;left:-4px;width:36px;height:36px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.aplay .wave svg{width:22px;height:22px}
.apick{border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;padding:8px 18px;width:100%}
.slots{display:flex;gap:12px;justify-content:center}
.slot{width:60px;height:60px;border-radius:50%;border:3px dashed #E6D3AE;display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--muted)}
.slot.fill{border-style:solid;border-color:transparent}.slot.fill svg{width:60%;height:60%}
.judge{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.score{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pill{background:#F3E8D2;border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px}
.pill.g{background:#DDF6E8;color:#0B7A5E}.pill.r{background:#FFE3DF;color:#B53A30}
/* games */
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:560px){.games{grid-template-columns:1fr}}
.gcard{border:2px solid var(--line);background:var(--card);border-radius:24px;padding:16px;text-align:right;display:flex;gap:14px;align-items:center}
.gcard .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none}
.gcard .ic svg{width:38px;height:38px}
.gcard b{font-size:18px;display:block}.gcard small{color:var(--muted);font-size:13px}
.qbox{padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.qtext{font-family:var(--quran);font-size:30px;line-height:2.2;text-align:center}
.blank{display:inline-block;min-width:3.4em;border-bottom:4px dashed var(--grape);color:var(--grape);margin:0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px 10px;font-family:var(--quran);font-size:26px;box-shadow:0 4px 0 var(--line)}
.opt.ui{font-family:var(--ui);font-size:18px;font-weight:700}
.opt.right{background:#DDF6E8;border-color:var(--mint)} .opt.wrong{background:#FFE3DF;border-color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 14px;font-family:var(--quran);font-size:26px;box-shadow:0 4px 0 var(--line)}
.tile.used{visibility:hidden}
.tile.ayahT{font-size:22px;width:100%;line-height:2}
.answer{min-height:72px;border:2px dashed #E6D3AE;border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-family:var(--quran);font-size:26px;line-height:2}
.answer .a{background:#EFFBF3;border-radius:10px;padding:0 8px}
.answer.col{flex-direction:column;align-items:stretch}
.answer.col .a{font-size:22px;padding:2px 10px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#EADBBE}.dots i.ok{background:var(--mint)}.dots i.no{background:var(--coral)}
select{font-family:var(--ui);font-size:15px;font-weight:700;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card);color:var(--ink)}
/* modal & toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(34,48,74,.45);display:grid;place-items:center;padding:16px}
.modal .card{max-width:420px;width:100%;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:in .3s}
.modal h3{font-size:24px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast svg{width:20px;height:20px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;text-align:center;font-size:12px;font-weight:700}
.badge svg{width:56px;height:56px}
.badge.off{opacity:.3;filter:grayscale(1)}
.note{font-size:13px;color:var(--muted);line-height:1.7}
</style>

َةٌ","يَقُولُونَ أَإِنَّا لَمَرْدُودُونَ فِي الْحَافِرَةِ","أَإِذَا كُنَّا عِظَامًا نَّخِرَةً","قَالُوا تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ","فَإِنَّمَا هِيَ زَجْرَةٌ وَاحِدَةٌ","فَإِذَا هُم بِالسَّاهِرَةِ","هَلْ أَتَاكَ حَدِيثُ مُوسَىٰ","إِذْ نَادَاهُ رَبُّهُ بِالْوَادِ الْمُقَدَّسِ طُوًى","اذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُ طَغَىٰ","فَقُلْ هَل لَّكَ إِلَىٰ أَن تَزَكَّىٰ","وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ","فَأَرَاهُ الْآيَةَ الْكُبْرَىٰ","فَكَذَّبَ وَعَصَىٰ","ثُمَّ أَدْبَرَ يَسْعَىٰ","فَحَشَرَ فَنَادَىٰ","فَقَالَ أَنَا رَبُّكُمُ الْأَعْلَىٰ","فَأَخَذَهُ اللَّهُ نَكَالَ الْآخِرَةِ وَالْأُولَىٰ","إِنَّ فِي ذَٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰ","أَأَنتُمْ أَشَدُّ خَلْقًا أَمِ السَّمَاءُ بَنَاهَا","رَفَعَ سَمْكَهَا فَسَوَّاهَا","وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَاهَا","وَالْأَرْضَ بَعْدَ ذَٰلِكَ دَحَاهَا","أَخْرَجَ مِنْهَا مَاءَهَا وَمَرْعَاهَا","وَالْجِبَالَ أَرْسَاهَا","مَتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ","فَإِذَا جَاءَتِ الطَّامَّةُ الْكُبْرَىٰ","يَوْمَ يَتَذَكَّرُ الْإِنسَانُ مَا سَعَىٰ","وَبُرِّزَتِ الْجَحِيمُ لِمَن يَرَىٰ","فَأَمَّا مَن طَغَىٰ","وَآثَرَ الْحَيَاةَ الدُّنْيَا","فَإِنَّ الْجَحِيمَ هِيَ الْمَأْوَىٰ","وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ","فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ","يَسْأَلُونَكَ عَنِ السَّاعَةِ أَيَّانَ مُرْسَاهَا","فِيمَ أَنتَ مِن ذِكْرَاهَا","إِلَىٰ رَبِّكَ مُنتَهَاهَا","إِنَّمَا أَنتَ مُنذِرُ مَن يَخْشَاهَا","كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوا إِلَّا عَشِيَّةً أَوْ ضُحَاهَا"]},{"n":80,"name":"عبس","a":["عَبَسَ وَتَوَلَّىٰ","أَن جَاءَهُ الْأَعْمَىٰ","وَمَا يُدْرِيكَ لَعَلَّهُ يَزَّكَّىٰ","أَوْ يَذَّكَّرُ فَتَنفَعَهُ الذِّكْرَىٰ","أَمَّا مَنِ اسْتَغْنَىٰ","فَأَنتَ لَهُ تَصَدَّىٰ","وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ","وَأَمَّا مَن جَاءَكَ يَسْعَىٰ","وَهُوَ يَخْشَىٰ","فَأَنتَ عَنْهُ تَلَهَّىٰ","كَلَّا إِنَّهَا تَذْكِرَةٌ","فَمَن شَاءَ ذَكَرَهُ","فِي صُحُفٍ مُّكَرَّمَةٍ","مَّرْفُوعَةٍ مُّطَهَّرَةٍ","بِأَيْدِي سَفَرَةٍ","كِرَامٍ بَرَرَةٍ","قُتِلَ الْإِنسَانُ مَا أَكْفَرَهُ","مِنْ أَيِّ شَيْءٍ خَلَقَهُ","مِن نُّطْفَةٍ خَلَقَهُ فَقَدَّرَهُ","ثُمَّ السَّبِيلَ يَسَّرَهُ","ثُمَّ أَمَاتَهُ فَأَقْبَرَهُ","ثُمَّ إِذَا شَاءَ أَنشَرَهُ","كَلَّا لَمَّا يَقْضِ مَا أَمَرَهُ","فَلْيَنظُرِ الْإِنسَانُ إِلَىٰ طَعَامِهِ","أَنَّا صَبَبْنَا الْمَاءَ صَبًّا","ثُمَّ شَقَقْنَا الْأَرْضَ شَقًّا","فَأَنبَتْنَا فِيهَا حَبًّا","وَعِنَبًا وَقَضْبًا","وَزَيْتُونًا وَنَخْلًا","وَحَدَائِقَ غُلْبًا","وَفَاكِهَةً وَأَبًّا","مَّتَاعًا لَّكُمْ وَلِأَنْعَامِكُمْ","فَإِذَا جَاءَتِ الصَّاخَّةُ","يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ","وَأُمِّهِ وَأَبِيهِ","وَصَاحِبَتِهِ وَبَنِيهِ","لِكُلِّ امْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ","وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ","ضَاحِكَةٌ مُّسْتَبْشِرَةٌ","وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ","تَرْهَقُهَا قَتَرَةٌ","أُولَٰئِكَ هُمُ الْكَفَرَةُ الْفَجَرَةُ"]},{"n":81,"name":"التكوير","a":["إِذَا الشَّمْسُ كُوِّرَتْ","وَإِذَا النُّجُومُ انكَدَرَتْ","وَإِذَا الْجِبَالُ سُيِّرَتْ","وَإِذَا الْعِشَارُ عُطِّلَتْ","وَإِذَا الْوُحُوشُ حُشِرَتْ","وَإِذَا الْبِحَارُ سُجِّرَتْ","وَإِذَا النُّفُوسُ زُوِّجَتْ","وَإِذَا الْمَوْءُودَةُ سُئِلَتْ","بِأَيِّ ذَنبٍ قُتِلَتْ","وَإِذَا الصُّحُفُ نُشِرَتْ","وَإِذَا السَّمَاءُ كُشِطَتْ","وَإِذَا الْجَحِيمُ سُعِّرَتْ","وَإِذَا الْجَنَّةُ أُزْلِفَتْ","عَلِمَتْ نَفْسٌ مَّا أَحْضَرَتْ","فَلَا أُقْسِمُ بِالْخُنَّسِ","الْجَوَارِ الْكُنَّسِ","وَاللَّيْلِ إِذَا عَسْعَسَ","وَالصُّبْحِ إِذَا تَنَفَّسَ","إِنَّهُ لَقَوْلُ رَسُولٍ كَرِيمٍ","ذِي قُوَّةٍ عِندَ ذِي الْعَرْشِ مَكِينٍ","مُّطَاعٍ ثَمَّ أَمِينٍ","وَمَا صَاحِبُكُم بِمَجْنُونٍ","وَلَقَدْ رَآهُ بِالْأُفُقِ الْمُبِينِ","وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِينٍ","وَمَا هُوَ بِقَوْلِ شَيْطَانٍ رَّجِيمٍ","فَأَيْنَ تَذْهَبُونَ","إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَالَمِينَ","لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ","وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ رَبُّ الْعَالَمِينَ"]},{"n":82,"name":"الانفطار","a":["إِذَا السَّمَاءُ انفَطَرَتْ","وَإِذَا الْكَوَاكِبُ انتَثَرَتْ","وَإِذَا الْبِحَارُ فُجِّرَتْ","وَإِذَا الْقُبُورُ بُعْثِرَتْ","عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ","يَا أَيُّهَا الْإِنسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيمِ","الَّذِي خَلَقَكَ فَسَوَّاكَ فَعَدَلَكَ","فِي أَيِّ صُورَةٍ مَّا شَاءَ رَكَّبَكَ","كَلَّا بَلْ تُكَذِّبُونَ بِالدِّينِ","وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ","كِرَامًا كَاتِبِينَ","يَعْلَمُونَ مَا تَفْعَلُونَ","إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ","وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ","يَصْلَوْنَهَا يَوْمَ الدِّينِ","وَمَا هُمْ عَنْهَا بِغَائِبِينَ","وَمَا أَدْرَاكَ مَا يَوْمُ الدِّينِ","ثُمَّ مَا أَدْرَاكَ مَا يَوْمُ الدِّينِ","يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْئًا وَالْأَمْرُ يَوْمَئِذٍ لِّلَّهِ"]},{"n":83,"name":"المطففين","a":["وَيْلٌ لِّلْمُطَفِّفِينَ","الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ","وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ","أَلَا يَظُنُّ أُولَٰئِكَ أَنَّهُم مَّبْعُوثُونَ","لِيَوْمٍ عَظِيمٍ","يَوْمَ يَقُومُ النَّاسُ لِرَبِّ الْعَالَمِينَ","كَلَّا إِنَّ كِتَابَ الْفُجَّارِ لَفِي سِجِّينٍ","وَمَا أَدْرَاكَ مَا سِجِّينٌ","كِتَابٌ مَّرْقُومٌ","وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","الَّذِينَ يُكَذِّبُونَ بِيَوْمِ الدِّينِ","وَمَا يُكَذِّبُ بِهِ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ","إِذَا تُتْلَىٰ عَلَيْهِ آيَاتُنَا قَالَ أَسَاطِيرُ الْأَوَّلِينَ","كَلَّا بَلْ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا يَكْسِبُونَ","كَلَّا إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ","ثُمَّ إِنَّهُمْ لَصَالُو الْجَحِيمِ","ثُمَّ يُقَالُ هَٰذَا الَّذِي كُنتُم بِهِ تُكَذِّبُونَ","كَلَّا إِنَّ كِتَابَ الْأَبْرَارِ لَفِي عِلِّيِّينَ","وَمَا أَدْرَاكَ مَا عِلِّيُّونَ","كِتَابٌ مَّرْقُومٌ","يَشْهَدُهُ الْمُقَرَّبُونَ","إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ","عَلَى الْأَرَائِكِ يَنظُرُونَ","تَعْرِفُ فِي وُجُوهِهِمْ نَضْرَةَ النَّعِيمِ","يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ","خِتَامُهُ مِسْكٌ وَفِي ذَٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُونَ","وَمِزَاجُهُ مِن تَسْنِيمٍ","عَيْنًا يَشْرَبُ بِهَا الْمُقَرَّبُونَ","إِنَّ الَّذِينَ أَجْرَمُوا كَانُوا مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ","وَإِذَا مَرُّوا بِهِمْ يَتَغَامَزُونَ","وَإِذَا انقَلَبُوا إِلَىٰ أَهْلِهِمُ انقَلَبُوا فَكِهِينَ","وَإِذَا رَأَوْهُمْ قَالُوا إِنَّ هَٰؤُلَاءِ لَضَالُّونَ","وَمَا أُرْسِلُوا عَلَيْهِمْ حَافِظِينَ","فَالْيَوْمَ الَّذِينَ آمَنُوا مِنَ الْكُفَّارِ يَضْحَكُونَ","عَلَى الْأَرَائِكِ يَنظُرُونَ","هَلْ ثُوِّبَ الْكُفَّارُ مَا كَانُوا يَفْعَلُونَ"]},{"n":84,"name":"الانشقاق","a":["إِذَا السَّمَاءُ انشَقَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","وَإِذَا الْأَرْضُ مُدَّتْ","وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","يَا أَيُّهَا الْإِنسَانُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَاقِيهِ","فَأَمَّا مَنْ أُوتِيَ كِتَابَهُ بِيَمِينِهِ","فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا","وَيَنقَلِبُ إِلَىٰ أَهْلِهِ مَسْرُورًا","وَأَمَّا مَنْ أُوتِيَ كِتَابَهُ وَرَاءَ ظَهْرِهِ","فَسَوْفَ يَدْعُو ثُبُورًا","وَيَصْلَىٰ سَعِيرًا","إِنَّهُ كَانَ فِي أَهْلِهِ مَسْرُورًا","إِنَّهُ ظَنَّ أَن لَّن يَحُورَ","بَلَىٰ إِنَّ رَبَّهُ كَانَ بِهِ بَصِيرًا","فَلَا أُقْسِمُ بِالشَّفَقِ","وَاللَّيْلِ وَمَا وَسَقَ","وَالْقَمَرِ إِذَا اتَّسَقَ","لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ","فَمَا لَهُمْ لَا يُؤْمِنُونَ","وَإِذَا قُرِئَ عَلَيْهِمُ الْقُرْآنُ لَا يَسْجُدُونَ","بَلِ الَّذِينَ كَفَرُوا يُكَذِّبُونَ","وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَ","فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ"]},{"n":85,"name":"البروج","a":["وَالسَّمَاءِ ذَاتِ الْبُرُوجِ","وَالْيَوْمِ الْمَوْعُودِ","وَشَاهِدٍ وَمَشْهُودٍ","قُتِلَ أَصْحَابُ الْأُخْدُودِ","النَّارِ ذَاتِ الْوَقُودِ","إِذْ هُمْ عَلَيْهَا قُعُودٌ","وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُؤْمِنِينَ شُهُودٌ","وَمَا نَقَمُوا مِنْهُمْ إِلَّا أَن يُؤْمِنُوا بِاللَّهِ الْعَزِيزِ الْحَمِيدِ","الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ وَاللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ","إِنَّ الَّذِينَ فَتَنُوا الْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ ثُمَّ لَمْ يَتُوبُوا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيقِ","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لَهُمْ جَنَّاتٌ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ ذَٰلِكَ الْفَوْزُ الْكَبِيرُ","إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","إِنَّهُ هُوَ يُبْدِئُ وَيُعِيدُ","وَهُوَ الْغَفُورُ الْوَدُودُ","ذُو الْعَرْشِ الْمَجِيدُ","فَعَّالٌ لِّمَا يُرِيدُ","هَلْ أَتَاكَ حَدِيثُ الْجُنُودِ","فِرْعَوْنَ وَثَمُودَ","بَلِ الَّذِينَ كَفَرُوا فِي تَكْذِيبٍ","وَاللَّهُ مِن وَرَائِهِم مُّحِيطٌ","بَلْ هُوَ قُرْآنٌ مَّجِيدٌ","فِي لَوْحٍ مَّحْفُوظٍ"]},{"n":86,"name":"الطارق","a":["وَالسَّمَاءِ وَالطَّارِقِ","وَمَا أَدْرَاكَ مَا الطَّارِقُ","النَّجْمُ الثَّاقِبُ","إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","فَلْيَنظُرِ الْإِنسَانُ مِمَّ خُلِقَ","خُلِقَ مِن مَّاءٍ دَافِقٍ","يَخْرُجُ مِن بَيْنِ الصُّلْبِ وَالتَّرَائِبِ","إِنَّهُ عَلَىٰ رَجْعِهِ لَقَادِرٌ","يَوْمَ تُبْلَى السَّرَائِرُ","فَمَا لَهُ مِن قُوَّةٍ وَلَا نَاصِرٍ","وَالسَّمَاءِ ذَاتِ الرَّجْعِ","وَالْأَرْضِ ذَاتِ الصَّدْعِ","إِنَّهُ لَقَوْلٌ فَصْلٌ","وَمَا هُوَ بِالْهَزْلِ","إِنَّهُمْ يَكِيدُونَ كَيْدًا","وَأَكِيدُ كَيْدًا","فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا"]},{"n":87,"name":"الأعلى","a":["سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى","الَّذِي خَلَقَ فَسَوَّىٰ","وَالَّذِي قَدَّرَ فَهَدَىٰ","وَالَّذِي أَخْرَجَ الْمَرْعَىٰ","فَجَعَلَهُ غُثَاءً أَحْوَىٰ","سَنُقْرِئُكَ فَلَا تَنسَىٰ","إِلَّا مَا شَاءَ اللَّهُ إِنَّهُ يَعْلَمُ الْجَهْرَ وَمَا يَخْفَىٰ","وَنُيَسِّرُكَ لِلْيُسْرَىٰ","فَذَكِّرْ إِن نَّفَعَتِ الذِّكْرَىٰ","سَيَذَّكَّرُ مَن يَخْشَىٰ","وَيَتَجَنَّبُهَا الْأَشْقَى","الَّذِي يَصْلَى النَّارَ الْكُبْرَىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","قَدْ أَفْلَحَ مَن تَزَكَّىٰ","وَذَكَرَ اسْمَ رَبِّهِ فَصَلَّىٰ","بَلْ تُؤْثِرُونَ الْحَيَاةَ الدُّنْيَا","وَالْآخِرَةُ خَيْرٌ وَأَبْقَىٰ","إِنَّ هَٰذَا لَفِي الصُّحُفِ الْأُولَىٰ","صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ"]},{"n":88,"name":"الغاشية","a":["هَلْ أَتَاكَ حَدِيثُ الْغَاشِيَةِ","وُجُوهٌ يَوْمَئِذٍ خَاشِعَةٌ","عَامِلَةٌ نَّاصِبَةٌ","تَصْلَىٰ نَارًا حَامِيَةً","تُسْقَىٰ مِنْ عَيْنٍ آنِيَةٍ","لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ","وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","لِّسَعْيِهَا رَاضِيَةٌ","فِي جَنَّةٍ عَالِيَةٍ","لَّا تَسْمَعُ فِيهَا لَاغِيَةً","فِيهَا عَيْنٌ جَارِيَةٌ","فِيهَا سُرُرٌ مَّرْفُوعَةٌ","وَأَكْوَابٌ مَّوْضُوعَةٌ","وَنَمَارِقُ مَصْفُوفَةٌ","وَزَرَابِيُّ مَبْثُوثَةٌ","أَفَلَا يَنظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ","وَإِلَى السَّمَاءِ كَيْفَ رُفِعَتْ","وَإِلَى الْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى الْأَرْضِ كَيْفَ سُطِحَتْ","فَذَكِّرْ إِنَّمَا أَنتَ مُذَكِّرٌ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","فَيُعَذِّبُهُ اللَّهُ الْعَذَابَ الْأَكْبَرَ","إِنَّ إِلَيْنَا إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم"]},{"n":89,"name":"الفجر","a":["وَالْفَجْرِ","وَلَيَالٍ عَشْرٍ","وَالشَّفْعِ وَالْوَتْرِ","وَاللَّيْلِ إِذَا يَسْرِ","هَلْ فِي ذَٰلِكَ قَسَمٌ لِّذِي حِجْرٍ","أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","إِرَمَ ذَاتِ الْعِمَادِ","الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ","وَثَمُودَ الَّذِينَ جَابُوا الصَّخْرَ بِالْوَادِ","وَفِرْعَوْنَ ذِي الْأَوْتَادِ","الَّذِينَ طَغَوْا فِي الْبِلَادِ","فَأَكْثَرُوا فِيهَا الْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","إِنَّ رَبَّكَ لَبِالْمِرْصَادِ","فَأَمَّا الْإِنسَانُ إِذَا مَا ابْتَلَاهُ رَبُّهُ فَأَكْرَمَهُ وَنَعَّمَهُ فَيَقُولُ رَبِّي أَكْرَمَنِ","وَأَمَّا إِذَا مَا ابْتَلَاهُ فَقَدَرَ عَلَيْهِ رِزْقَهُ فَيَقُولُ رَبِّي أَهَانَنِ","كَلَّا بَل لَّا تُكْرِمُونَ الْيَتِيمَ","وَلَا تَحَاضُّونَ عَلَىٰ طَعَامِ الْمِسْكِينِ","وَتَأْكُلُونَ التُّرَاثَ أَكْلًا لَّمًّا","وَتُحِبُّونَ الْمَالَ حُبًّا جَمًّا","كَلَّا إِذَا دُكَّتِ الْأَرْضُ دَكًّا دَكًّا","وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا","وَجِيءَ يَوْمَئِذٍ بِجَهَنَّمَ يَوْمَئِذٍ يَتَذَكَّرُ الْإِنسَانُ وَأَنَّىٰ لَهُ الذِّكْرَىٰ","يَقُولُ يَا لَيْتَنِي قَدَّمْتُ لِحَيَاتِي","فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُ أَحَدٌ","وَلَا يُوثِقُ وَثَاقَهُ أَحَدٌ","يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ","ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","فَادْخُلِي فِي عِبَادِي","وَادْخُلِي جَنَّتِي"]},{"n":90,"name":"البلد","a":["لَا أُقْسِمُ بِهَٰذَا الْبَلَدِ","وَأَنتَ حِلٌّ بِهَٰذَا الْبَلَدِ","وَوَالِدٍ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي كَبَدٍ","أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","أَيَحْسَبُ أَن لَّمْ يَرَهُ أَحَدٌ","أَلَمْ نَجْعَل لَّهُ عَيْنَيْنِ","وَلِسَانًا وَشَفَتَيْنِ","وَهَدَيْنَاهُ النَّجْدَيْنِ","فَلَا اقْتَحَمَ الْعَقَبَةَ","وَمَا أَدْرَاكَ مَا الْعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوْ إِطْعَامٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ","يَتِيمًا ذَا مَقْرَبَةٍ","أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","ثُمَّ كَانَ مِنَ الَّذِينَ آمَنُوا وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِ","أُولَٰئِكَ أَصْحَابُ الْمَيْمَنَةِ","وَالَّذِينَ كَفَرُوا بِآيَاتِنَا هُمْ أَصْحَابُ الْمَشْأَمَةِ","عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌ"]},{"n":91,"name":"الشمس","a":["وَالشَّمْسِ وَضُحَاهَا","وَالْقَمَرِ إِذَا تَلَاهَا","وَالنَّهَارِ إِذَا جَلَّاهَا","وَاللَّيْلِ إِذَا يَغْشَاهَا","وَالسَّمَاءِ وَمَا بَنَاهَا","وَالْأَرْضِ وَمَا طَحَاهَا","وَنَفْسٍ وَمَا سَوَّاهَا","فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا","قَدْ أَفْلَحَ مَن زَكَّاهَا","وَقَدْ خَابَ مَن دَسَّاهَا","كَذَّبَتْ ثَمُودُ بِطَغْوَاهَا","إِذِ انبَعَثَ أَشْقَاهَا","فَقَالَ لَهُمْ رَسُولُ اللَّهِ نَاقَةَ اللَّهِ وَسُقْيَاهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنبِهِمْ فَسَوَّاهَا","وَلَا يَخَافُ عُقْبَاهَا"]},{"n":92,"name":"الليل","a":["وَاللَّيْلِ إِذَا يَغْشَىٰ","وَالنَّهَارِ إِذَا تَجَلَّىٰ","وَمَا خَلَقَ الذَّكَرَ وَالْأُنثَىٰ","إِنَّ سَعْيَكُمْ لَشَتَّىٰ","فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ","وَصَدَّقَ بِالْحُسْنَىٰ","فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ","وَأَمَّا مَن بَخِلَ وَاسْتَغْنَىٰ","وَكَذَّبَ بِالْحُسْنَىٰ","فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ","وَمَا يُغْنِي عَنْهُ مَالُهُ إِذَا تَرَدَّىٰ","إِنَّ عَلَيْنَا لَلْهُدَىٰ","وَإِنَّ لَنَا لَلْآخِرَةَ وَالْأُولَىٰ","فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","لَا يَصْلَاهَا إِلَّا الْأَشْقَى","الَّذِي كَذَّبَ وَتَوَلَّىٰ","وَسَيُجَنَّبُهَا الْأَتْقَى","الَّذِي يُؤْتِي مَالَهُ يَتَزَكَّىٰ","وَمَا لِأَحَدٍ عِندَهُ مِن نِّعْمَةٍ تُجْزَىٰ","إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ","وَلَسَوْفَ يَرْضَىٰ"]},{"n":93,"name":"الضحى","a":["وَالضُّحَىٰ","وَاللَّيْلِ إِذَا سَجَىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","وَلَلْآخِرَةُ خَيْرٌ لَّكَ مِنَ الْأُولَىٰ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ","أَلَمْ يَجِدْكَ يَتِيمًا فَآوَىٰ","وَوَجَدَكَ ضَالًّا فَهَدَىٰ","وَوَجَدَكَ عَائِلًا فَأَغْنَىٰ","فَأَمَّا الْيَتِيمَ فَلَا تَقْهَرْ","وَأَمَّا السَّائِلَ فَلَا تَنْهَرْ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"]},{"n":94,"name":"الشرح","a":["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","الَّذِي أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَ","فَإِنَّ مَعَ الْعُسْرِ يُسْرًا","إِنَّ مَعَ الْعُسْرِ يُسْرًا","فَإِذَا فَرَغْتَ فَانصَبْ","وَإِلَىٰ رَبِّكَ فَارْغَب"]},{"n":95,"name":"التين","a":["وَالتِّينِ وَالزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَٰذَا الْبَلَدِ الْأَمِينِ","لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ","ثُمَّ رَدَدْنَاهُ أَسْفَلَ سَافِلِينَ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِ","أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ"]},{"n":96,"name":"العلق","a":["اقْرَأْ بِاسْمِ رَبِّكَ الَّذِي خَلَقَ","خَلَقَ الْإِنسَانَ مِنْ عَلَقٍ","اقْرَأْ وَرَبُّكَ الْأَكْرَمُ","الَّذِي عَلَّمَ بِالْقَلَمِ","عَلَّمَ الْإِنسَانَ مَا لَمْ يَعْلَمْ","كَلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ","أَن رَّآهُ اسْتَغْنَىٰ","إِنَّ إِلَىٰ رَبِّكَ الرُّجْعَىٰ","أَرَأَيْتَ الَّذِي يَنْهَىٰ","عَبْدًا إِذَا صَلَّىٰ","أَرَأَيْتَ إِن كَانَ عَلَى الْهُدَىٰ","أَوْ أَمَرَ بِالتَّقْوَىٰ","أَرَأَيْتَ إِن كَذَّبَ وَتَوَلَّىٰ","أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ","كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًا بِالنَّاصِيَةِ","نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍ","فَلْيَدْعُ نَادِيَهُ","سَنَدْعُ الزَّبَانِيَةَ","كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِب"]},{"n":97,"name":"القدر","a":["إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ","وَمَا أَدْرَاكَ مَا لَيْلَةُ الْقَدْرِ","لَيْلَةُ الْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","تَنَزَّلُ الْمَلَائِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","سَلَامٌ هِيَ حَتَّىٰ مَطْلَعِ الْفَجْرِ"]},{"n":98,"name":"البينة","a":["لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ","رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً","فِيهَا كُتُبٌ قَيِّمَةٌ","وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ","وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ وَذَٰلِكَ دِينُ الْقَيِّمَةِ","إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا أُولَٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ","إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ","جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ"]},{"n":99,"name":"الزلزلة","a":["إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا","وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا","وَقَالَ الْإِنسَانُ مَا لَهَا","يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ","فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ","وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ"]},{"n":100,"name":"العاديات","a":["وَالْعَادِيَاتِ ضَبْحًا","فَالْمُورِيَاتِ قَدْحًا","فَالْمُغِيرَاتِ صُبْحًا","فَأَثَرْنَ بِهِ نَقْعًا","فَوَسَطْنَ بِهِ جَمْعًا","إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ","وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ","وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ","أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ","وَحُصِّلَ مَا فِي الصُّدُورِ","إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ"]},{"n":101,"name":"القارعة","a":["الْقَارِعَةُ","مَا الْقَارِعَةُ","وَمَا أَدْرَاكَ مَا الْقَارِعَةُ","يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ","وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ","فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ","فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ","وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ","فَأُمُّهُ هَاوِيَةٌ","وَمَا أَدْرَاكَ مَا هِيَهْ","نَارٌ حَامِيَةٌ"]},{"n":102,"name":"التكاثر","a":["أَلْهَاكُمُ التَّكَاثُرُ","حَتَّىٰ زُرْتُمُ الْمَقَابِرَ","كَلَّا سَوْفَ تَعْلَمُونَ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ","لَتَرَوُنَّ الْجَحِيمَ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ","ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ"]},{"n":103,"name":"العصر","a":["وَالْعَصْرِ","إِنَّ الْإِنسَانَ لَفِي خُسْرٍ","إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ"]},{"n":104,"name":"الهمزة","a":["وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ","الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ","يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ","كَلَّا لَيُنبَذَنَّ فِي الْحُطَمَةِ","وَمَا أَدْرَاكَ مَا الْحُطَمَةُ","نَارُ اللَّهِ الْمُوقَدَةُ","الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ","إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ","فِي عَمَدٍ مُّمَدَّدَةٍ"]},{"n":105,"name":"الفيل","a":["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولٍ"]},{"n":106,"name":"قريش","a":["لِإِيلَافِ قُرَيْشٍ","إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ","فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ","الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ"]},{"n":107,"name":"الماعون","a":["أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ","فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ","فَوَيْلٌ لِّلْمُصَلِّينَ","الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","الَّذِينَ هُمْ يُرَاءُونَ","وَيَمْنَعُونَ الْمَاعُونَ"]},{"n":108,"name":"الكوثر","a":["إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ","إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ"]},{"n":109,"name":"الكافرون","a":["قُلْ يَا أَيُّهَا الْكَافِرُونَ","لَا أَعْبُدُ مَا تَعْبُدُونَ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ","وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ","لَكُمْ دِينُكُمْ وَلِيَ دِينِ"]},{"n":110,"name":"النصر","a":["إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ","وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِ const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S=n=>QURAN.find(s=>s.n===+n);

const lev=(a,b)=>{const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]};
const near=(a,b)=>{a=a.replace(/^ال/,'');b=b.replace(/^ال/,'');if(!a||!b)return false;if(a===b)return true;return lev(a,b)<=Math.max(1,Math.floor(Math.max(a.length,b.length)*.34))};

const LEVELS=[[0,'بذرة'],[60,'برعم'],[180,'شتلة'],[400,'شجرة'],[800,'نخلة'],[1500,'بستان']];
const blank=()=>({stars:0,streak:0,last:'',s:{},games:0,perfect:0});
let ST=blank(), DBREF=null;
const today=()=>new Date().toISOString().slice(0,10);
function loadLocal(){try{const v=JSON.parse(localStorage.getItem('hadiqa')||'null');if(v)ST=Object.assign(blank(),v)}catch(e){}}
let saveT;function save(){try{localStorage.setItem('hadiqa',JSON.stringify(ST))}catch(e){}clearTimeout(saveT);saveT=setTimeout(()=>{if(DBREF)DBREF.set(JSON.parse(JSON.stringify(ST))).catch(()=>{})},800)}

const ss=n=>ST.s[n]||(ST.s[n]={w:0,r:0,best:0,g:0,gc:0});
function stage(n){const x=ST.s[n];if(!x)return 0;return (x.w?1:0)+((x.r||x.m)?1:0)+(x.g?1:0)}
const STEPS={w:['استمع','listen'],r:['سمّع','recite'],g:['العب','games']};
function growStage(n,key,cb){const x=ss(n);if(x[key]||(key==='r'&&x.m)){cb&&cb();return}const b=stage(n);x[key]=1;const a=stage(n);addStars(10,'نمت نبتتك');const s=S(n);

 const left=Object.keys(STEPS).filter(k=>!x[k]&&!(k==='r'&&x.m));
 modal(`<h3>${msg}</h3><div class="growbox"><div class="g-old">${plantSVG(b,120)}</div><div class="g-new">${plantSVG(a,150)}</div></div><div class="row" style="justify-content:center">${Object.keys(STEPS).map(k=>`<span class="pill ${(x[k]||(k==='r'&&x.m))?'g':''}">${STEPS[k][0]} ${(x[k]||(k==='r'&&x.m))?'✓':'○'}</span>`).join('')}</div><p class="note">${left.length?'لتكبر أكثر: '+left.map(k=>STEPS[k][0]).join(' ثم ')+'.':'ما شاء الله! أتممتَ كل المراحل.'}</p>`,'رائع!',cb);
 confetti();speak(msg)}
function level(){let i=0;LEVELS.forEach((l,k)=>{if(ST.stars>=l[0])i=k});return i}
function addStars(k,why){const before=level();ST.stars+=k;const d=today();if(ST.last!==d){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);ST.streak=ST.last===y?ST.streak+1:1;ST.last=d}save();refreshTop();toast(`+${AR(k)} نجمة${why?' · '+why:''}`);if(level()>before){setTimeout(()=>modal(`<h3>مستوى جديد!</h3>${plantSVG(Math.min(3,level()),120)}<p style="font-weight:700;font-size:20px;margin:0">صرتَ «${LEVELS[level()][1]}»</p><p class="note">واصل يا بطل، حديقتك تكبر كل يوم.</p>`,'رائع!'),900);confetti()}}

 if(type==='sura'){const {s,i}=pickAyah(1);const others=shuffle(QURAN.filter(x=>x.n!==s.n)).slice(0,2);const opts=shuffle([{n:s.n,ok:1},...others.map(x=>({n:x.n}))]);return{type,s,i,opts}}
 if(type==='next'){const s=pick3();const i=Math.floor(Math.random()*(s.a.length-1));const cand=shuffle([...Array(s.a.length).keys()].filter(k=>k!==i&&k!==i+1)).slice(0,2);const opts=shuffle([{n:s.n,i:i+1,ok:1},...cand.map(k=>({n:s.n,i:k}))]);return{type,s,i,opts}}
 if(type==='aorder'){const s=pick3();const st=Math.floor(Math.random()*(s.a.length-2));return{type,s,i:st,parts:[st,st+1,st+2]}}
 if(type==='complete'){const {s,i,w}=pickAyah(3);const k=w.length-1;const ans=w[k];const all=QURAN.flatMap(x=>x.a.map(a=>a.split(' ').pop()));const ds=shuffle([...new Set(all.filter(x=>norm(x)!==norm(ans)))]).slice(0,2);return{type,s,i,prompt:`${w.slice(0,k).join(' ')} <span class="blank">؟</span>`,ropts:shuffle([ans,...ds]),ans}}
 if(type==='which'){const {s,i,w}=pickAyah(3);const others=shuffle(QURAN.filter(x=>x.n!==s.n)).slice(0,2).map(x=>x.name);return{type,s,i,prompt:w.join(' '),ropts:shuffle([s.name,...others]),ans:s.name,ui:true}}
 if(type==='words'){const {s,i,w}=pickAyah(3,8);return{type,s,i,parts:w}}
 if(type==='order'){const s=pick3();const len=s.a.length>=4?4:3;const st=Math.floor(Math.random()*(s.a.length-len+1));return{type,s,i:st,parts:s.a.slice(st,st+len)}}
}

   qb.innerHTML=`${hint}<div class="qtext">${Q.prompt}</div><div class="opts">${Q.ropts.map(o=>`<button class="opt ${Q.ui?'ui':''}">${o}</button>`).join('')}</div>`;
   qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock())return;const ok=b.textContent===Q.ans;b.classList.add(ok?'right':'wrong');if(!ok)qb.querySelectorAll('.opt').forEach(x=>{if(x.textContent===Q.ans)x.classList.add('right')});if(ok&&type==='complete')qb.querySelector('.blank').textContent=Q.ans;done(ok)})}
  else{const isA=type==='order';const order=Q.parts.map((p,k)=>({p,k}));let sh=shuffle(order);if(sh.every((x,k)=>x.k===k))sh=sh.reverse();let pos=0,miss=0;
   qb.innerHTML=`<div class="sub" style="text-align:center">سورة ${Q.s.name}</div><div class="answer ${isA?'col':''}" id="ans"></div><div class="tiles">${sh.map(x=>`<button class="tile ${isA?'ayahT':''}" data-k="${x.k}">${x.p}</button>`).join('')}</div>`;
   qb.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(+b.dataset.k===pos){b.classList.add('used');qb.querySelector('#ans').append(h(`<span class="a">${b.textContent}${isA?` <span class="num">﴿${AR(Q.i+pos+1)}﴾</span>`:''}</span>`));pos++;if(pos===Q.parts.length)done(miss<2)}else{miss++;b.style.animation='shake .35s';setTimeout(()=>b.style.animation='',400);beep(false);if(miss===2)nourSay('ركّز… أي كلمة تأتي الآن؟','sad')}})}
  app.append(v)}
 function endGame(){stopAudio();const g2=G.res.filter(x=>x).length;ST.games=(ST.games||0)+1;if(g2===G.total){ST.perfect=(ST.perfect||0)+1;addStars(5,'جولة كاملة');confetti()}else save();
  const growNext=()=>{const n=G.grow.shift();if(n)growStage(n,'g',growNext)};
  modal(`<h3>${g2===G.total?'جولة كاملة!':g2>=3?'أحسنت!':'حاول مرة أخرى'}</h3>${nourSVG().replace('class="nour"','class="nour happy"')}<p style="font-size:22px;font-weight:800;margin:0">${AR(g2)} من ${AR(G.total)}</p>`,'العب مرة أخرى',()=>{if(G.grow.length){growNext()}else startGame(type)});
  speak(g2>=3?'أحسنت':'حاول مرة أخرى');
  const m=$('#layer .modal:last-child .card');const b=h(`<button class="btn ghost sm">رجوع للألعاب</button>`);b.onclick=()=>{m.parentElement.remove();if(G.grow.length)growNext();route('games')};m.append(b)}
 next()}

/* ---------- boot ---------- */
loadLocal();refreshTop();route('home');initDb();
</script>
